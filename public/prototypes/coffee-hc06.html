<!doctype html>
<!-- PROTOTYPE, throwaway: HC-06 Web Serial smoke test for the Coffee module (ticket #218). Not production. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HC-06 smoke test (PROTOTYPE)</title>
<style>
  body{font:15px system-ui;max-width:640px;margin:1rem auto;padding:0 1rem;background:#111;color:#eee}
  button,select,input{font:inherit;padding:.5rem;margin:.15rem 0}
  input[type=text]{width:100%;box-sizing:border-box}
  #log{background:#000;border:1px solid #444;height:300px;overflow:auto;white-space:pre-wrap;padding:.5rem;font:13px ui-monospace,monospace}
  .tx{color:#7cf}.rx{color:#8f8}.err{color:#f88}.info{color:#aaa}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
</style>
<h2>HC-06 smoke test <small>(PROTOTYPE)</small></h2>
<p id="support" class="info"></p>
<div class="row">
  <label>Baud
    <select id="baud">
      <option>9600</option><option>1200</option><option>2400</option><option>4800</option>
      <option>19200</option><option>38400</option><option>57600</option><option>115200</option>
    </select>
  </label>
  <label>Line ending
    <select id="eol">
      <option value="">none</option>
      <option value="\n">LF (\n)</option>
      <option value="\r">CR (\r)</option>
      <option value="\r\n">CRLF (\r\n)</option>
    </select>
  </label>
</div>
<div class="row">
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <span id="status" class="info">disconnected</span>
</div>
<input type="text" id="text" value="GRIND 1.00">
<div class="row">
  <button id="send" disabled>Send</button>
  <button id="home" disabled>HOME</button>
  <button id="clear">Clear log</button>
</div>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
let port, reader, writer, keepReading = false;

$('support').textContent =
  `'serial' in navigator: ${'serial' in navigator} · isSecureContext: ${isSecureContext} · ${location.href}`;

function log(cls, msg) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = `${new Date().toISOString().slice(11, 23)} ${msg}`;
  $('log').append(d);
  $('log').scrollTop = 1e9;
}
const show = (s) => [...s].map((c) => (c === '\n' ? '\\n' : c === '\r' ? '\\r' : c)).join('');
function setUi(connected) {
  $('connect').disabled = connected;
  $('disconnect').disabled = !connected;
  $('send').disabled = $('home').disabled = !connected;
  $('status').textContent = connected ? 'connected' : 'disconnected';
}

async function readLoop() {
  while (port?.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        const text = new TextDecoder().decode(value);
        const hex = [...value].map((b) => b.toString(16).padStart(2, '0')).join(' ');
        log('rx', `RX ${value.length}B  "${show(text)}"  [${hex}]`);
      }
    } catch (e) {
      log('err', `read error: ${e.name}: ${e.message}`);
    } finally {
      reader.releaseLock();
    }
  }
}

$('connect').onclick = async () => {
  try {
    // No filter: lists every paired serial port incl. Bluetooth SPP (Windows COMx).
    port = await navigator.serial.requestPort();
    const baudRate = Number($('baud').value);
    const t0 = performance.now();
    await port.open({ baudRate });
    log('info', `opened @${baudRate} in ${Math.round(performance.now() - t0)}ms; info=${JSON.stringify(port.getInfo())}`);
    writer = port.writable.getWriter();
    keepReading = true;
    setUi(true);
    port.addEventListener?.('disconnect', () => log('err', 'event: port disconnect'));
    readLoop();
  } catch (e) {
    log('err', `connect failed: ${e.name}: ${e.message}`);
  }
};

async function disconnect() {
  keepReading = false;
  try { await reader?.cancel(); } catch {}
  try { writer?.releaseLock(); } catch {}
  try { await port?.close(); log('info', 'closed'); } catch (e) { log('err', `close: ${e.name}: ${e.message}`); }
  port = reader = writer = undefined;
  setUi(false);
}
$('disconnect').onclick = disconnect;

async function send(text) {
  const eol = JSON.parse(`"${$('eol').value}"`);
  const out = text + eol;
  try {
    await writer.write(new TextEncoder().encode(out));
    log('tx', `TX "${show(out)}"`);
  } catch (e) {
    log('err', `write error: ${e.name}: ${e.message}`);
  }
}
$('send').onclick = () => send($('text').value);
$('home').onclick = () => send('HOME');
$('text').onkeydown = (e) => { if (e.key === 'Enter' && !$('send').disabled) send($('text').value); };
$('clear').onclick = () => ($('log').textContent = '');
</script>
